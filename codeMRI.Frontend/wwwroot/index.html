<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>codeMRI.Frontend</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="codeMRI.Frontend.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: false });
        
        window.renderMermaidDiagrams = async () => {
            console.log("Starting renderMermaidDiagrams...");
            const elements = document.querySelectorAll('code.language-mermaid, div.mermaid, pre > code.language-mermaid');
            console.log(`Found ${elements.length} potential mermaid elements.`);
            
            for (const element of elements) {
                // Skip if already rendered
                if (element.getAttribute('data-processed')) {
                    console.log("Skipping already processed element.");
                    continue;
                }
                
                // If it's a code block, we might need to unwrap it or just read text
                let content = element.textContent;
                console.log("Processing element with content length:", content.length);
                
                // Create a container for the svg
                const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
                const container = document.createElement('div');
                container.id = id;
                container.className = 'mermaid';
                
                // Replace the original element with the container (or insert after)
                // For code blocks inside pre, we usually want to replace the pre
                if (element.tagName === 'CODE' && element.parentElement.tagName === 'PRE') {
                    console.log("Replacing PRE/CODE block.");
                    element.parentElement.replaceWith(container);
                } else {
                    console.log("Replacing element directly.");
                    element.replaceWith(container);
                }
                
                try {
                    const { svg } = await mermaid.render(id, content);
                    container.innerHTML = svg;
                    container.setAttribute('data-processed', 'true');
                    console.log(`Successfully rendered diagram ${id}`);
                } catch (error) {
                    console.error('Mermaid rendering failed:', error);
                    container.innerHTML = '<p style="color:red">Failed to render diagram</p><pre>' + content + '</pre>';
                }
            }
        };
    </script>
</body>

</html>
