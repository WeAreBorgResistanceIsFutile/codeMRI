<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>codeMRI.Frontend</title>
    <base href="/" />
    <link href="lib/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="favicon.png" rel="icon" type="image/png" />
    <link href="codeMRI.Frontend.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle cx="50%" cy="50%" r="40%" />
            <circle cx="50%" cy="50%" r="40%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a class="reload" href=".">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: false });

        window.scrollToTop = (selector) => {
            const el = document.querySelector(selector);
            if (el) el.scrollTop = 0;
        };

        window.adjustPopovers = () => {
            const markers = document.querySelectorAll('.citation-marker');
            markers.forEach(marker => {
                if (marker.dataset.processed) return;
                marker.dataset.processed = "true";

                marker.addEventListener('mouseenter', () => {
                    const popover = marker.querySelector('.citation-popover');
                    if (!popover) return;

                    // Reset styling to ensure we can measure dimensions
                    // We must set position fixed to measure against viewport 
                    // but we need initial dimensions first.
                    popover.style.removeProperty('top');
                    popover.style.removeProperty('bottom');
                    popover.style.removeProperty('left');
                    popover.style.removeProperty('transform');
                    popover.style.removeProperty('max-height');

                    // Force fixed immediately to act as a properly sized overlay
                    popover.style.position = 'fixed';
                    popover.style.visibility = 'hidden';
                    popover.style.display = 'block'; // Ensure internal layout runs

                    const markerRect = marker.getBoundingClientRect();
                    const popoverRect = popover.getBoundingClientRect();

                    const viewportWidth = window.innerWidth;
                    const viewportHeight = window.innerHeight;
                    const padding = 15; // Padding from screen edges

                    // --- Horizontal Positioning (Center on Marker, Clamp to Viewport) ---
                    let left = markerRect.left + (markerRect.width / 2) - (popoverRect.width / 2);

                    // Clamp Left
                    if (left < padding) left = padding;

                    // Clamp Right
                    if (left + popoverRect.width > viewportWidth - padding) {
                        left = viewportWidth - padding - popoverRect.width;
                    }

                    // --- Vertical Positioning (Prefer Top, then Bottom, Clamp Max Height) ---
                    const spaceAbove = markerRect.top - padding;
                    const spaceBelow = viewportHeight - markerRect.bottom - padding;

                    // Gap between marker and popover
                    const gap = 10;

                    let top = 0;
                    let maxHeight = 0;
                    let placement = 'top';

                    // Heuristic: If enough space above for full height? 
                    // Or if space above is simply larger than space below?
                    // We generally prefer top.

                    // Check if full height fits above
                    if (spaceAbove >= popoverRect.height + gap) {
                        placement = 'top';
                    } else if (spaceBelow >= popoverRect.height + gap) {
                        placement = 'bottom';
                    } else {
                        // Doesn't fit fully either way. Pick the side with MORE space.
                        placement = (spaceAbove > spaceBelow) ? 'top' : 'bottom';
                    }

                    if (placement === 'top') {
                        // Place above marker
                        // Bottom of popover at (markerRect.top - gap)
                        // Top of popover = (markerRect.top - gap) - popoverHeight
                        // BUT if we restrict max-height, we set Top to (markerRect.top - gap - constrainedHeight)?
                        // Easier to set 'bottom' relative to viewport? 
                        // top = markerRect.top - gap - popoverRect.height;

                        const availableHeight = spaceAbove - gap;
                        // Constrain height if needed (ensure we don't go negative on top)
                        maxHeight = Math.min(popoverRect.height, availableHeight);

                        top = markerRect.top - gap - maxHeight;
                    } else {
                        // Place below marker
                        top = markerRect.bottom + gap;

                        const availableHeight = spaceBelow - gap;
                        maxHeight = Math.min(popoverRect.height, availableHeight);
                    }

                    // Apply Styles
                    popover.style.left = `${left}px`;
                    popover.style.top = `${top}px`;
                    popover.style.maxHeight = `${maxHeight}px`;

                    // Style adjustments for fixed
                    popover.style.margin = '0'; // clear auto margins
                    popover.style.transform = 'none'; // clear CSS transforms

                    // Correct the arrow? 
                    // The CSS arrow uses ::after with absolute targeting.
                    // If popover is fixed, ::after is absolute relative to popover. 
                    // We just need to flip the class.
                    if (placement === 'bottom') {
                        popover.classList.add('flipped');
                    } else {
                        popover.classList.remove('flipped');
                    }

                    // Arrow Horizontal Position:
                    // The arrow is normally centered (left: 50%).
                    // But if popover is shifted (clamped), the arrow should point to the MARKER.
                    // We need to calculate the arrow offset.
                    // Marker center relative to Popover Left edge.
                    const markerCenter = markerRect.left + (markerRect.width / 2);
                    const arrowX = markerCenter - left;

                    // We set a CSS variable or direct style for the arrow?
                    // We can't style pseudo-elements directly. 
                    // Workaround: Adjust a variable that the CSS uses? 
                    // Or simpler: Don't perfect the arrow for edge clamps, but it's nice to have.
                    // Let's set a CSS variable --arrow-left.
                    popover.style.setProperty('--arrow-left', `${arrowX}px`);

                    // Make visible
                    popover.style.visibility = 'visible';
                });

                // We also need to handle mouseleave/scrolling to hide/reset?
                // CSS hover handles visibility, but 'position: fixed' might detach it from the marker's hover area?
                // If popover is child of marker, looking at structure:
                // <span marker> <popover> </span>
                // Even with position:fixed, it is still a child. 
                // Hovering the MARKER triggers the CSS visibility. 
                // BUT we manually set visibility='visible' above. 
                // If mouse leaves, CSS attempts to set visibility:hidden. 
                // Does CSS hover rule override inline style? NO. Inline wins.
                // WE MUST clear the inline visibility on mouse leave.

                marker.addEventListener('mouseleave', () => {
                    const popover = marker.querySelector('.citation-popover');
                    if (!popover) return;
                    // Clear inline visibility so CSS takes over (and hides it)
                    popover.style.visibility = '';
                    // Also maybe clear fixed to reset flow? 
                    // Not strictly necessary if it's hidden, but good for cleanliness.
                    // popover.style.position = '';
                });
            });
        };

        window.renderMermaidDiagrams = async () => {
            console.log("Starting renderMermaidDiagrams...");

            const initZoomPan = (container, svgId, originalSource) => {
                const svg = container.querySelector('svg');
                if (!svg) return;

                // Create wrapper for panning
                const wrapper = document.createElement('div');
                wrapper.className = 'mermaid-svg-wrapper';
                svg.parentNode.insertBefore(wrapper, svg);
                wrapper.appendChild(svg);

                // Create code view (hidden initially)
                const codeView = document.createElement('pre');
                codeView.className = 'mermaid-code-view';
                codeView.style.display = 'none';
                const codeBlock = document.createElement('code');
                codeBlock.textContent = originalSource;
                codeView.appendChild(codeBlock);
                container.appendChild(codeView);

                // Initial state
                let state = { x: 0, y: 0, scale: 1, isDragging: false, startX: 0, startY: 0, showCode: false };

                const updateTransform = () => {
                    svg.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
                    svg.style.transition = state.isDragging ? 'none' : 'transform 0.1s ease-out';
                };

                // Ensure SVG fits properly and remove any fixed dimensions Mermaid might have added
                svg.removeAttribute('width');
                svg.removeAttribute('height');
                svg.style.width = '100%';
                svg.style.height = '100%';
                svg.style.maxWidth = 'none';

                // Initial transform update
                updateTransform();

                const toggleView = (btn) => {
                    state.showCode = !state.showCode;
                    wrapper.style.display = state.showCode ? 'none' : 'flex';
                    codeView.style.display = state.showCode ? 'block' : 'none';
                    btn.innerHTML = state.showCode ? '<span>🖼️</span>' : '<span>📝</span>';
                    btn.title = state.showCode ? 'Show Diagram' : 'Show Code';

                    // Disable other controls in code mode
                    const otherBtns = container.querySelectorAll('.mermaid-btn:not(.toggle-btn)');
                    otherBtns.forEach(b => b.style.opacity = state.showCode ? '0.5' : '1');
                    otherBtns.forEach(b => b.style.pointerEvents = state.showCode ? 'none' : 'auto');
                };

                // Add Controls
                const controls = document.createElement('div');
                controls.className = 'mermaid-controls';
                controls.innerHTML = `
                    <div class="mermaid-btn toggle-btn" title="Show Code"><span>📝</span></div>
                    <div class="mermaid-vr"></div>
                    <div class="mermaid-btn" title="Zoom In" onclick="this.dispatchEvent(new CustomEvent('zoom', {detail: 1.2, bubbles: true}))">+</div>
                    <div class="mermaid-btn" title="Zoom Out" onclick="this.dispatchEvent(new CustomEvent('zoom', {detail: 0.8, bubbles: true}))">-</div>
                    <div class="mermaid-btn" title="Reset" onclick="this.dispatchEvent(new CustomEvent('reset', {bubbles: true}))">⟲</div>
                `;
                container.appendChild(controls);

                // Event Listeners for Controls
                controls.querySelector('.toggle-btn').addEventListener('click', function () {
                    toggleView(this);
                });

                controls.addEventListener('zoom', (e) => {
                    state.scale *= e.detail;
                    updateTransform();
                });
                controls.addEventListener('reset', () => {
                    state = { x: 0, y: 0, scale: 1, isDragging: false, startX: 0, startY: 0, showCode: state.showCode };
                    updateTransform();
                });

                // Mouse/Touch Events for Panning
                wrapper.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.mermaid-controls')) return;
                    state.isDragging = true;
                    state.startX = e.clientX - state.x;
                    state.startY = e.clientY - state.y;
                    wrapper.style.cursor = 'grabbing';
                });

                window.addEventListener('mousemove', (e) => {
                    if (!state.isDragging) return;
                    e.preventDefault();
                    state.x = e.clientX - state.startX;
                    state.y = e.clientY - state.startY;
                    updateTransform();
                });

                window.addEventListener('mouseup', () => {
                    state.isDragging = false;
                    wrapper.style.cursor = 'grab';
                });

                // Ensure SVG fits initially - redundant but safe
                svg.style.maxWidth = 'none';
                svg.style.height = '100%';
                svg.style.width = '100%';
            };

            const processElement = async (element, content, isFenced) => {
                const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
                const container = document.createElement('div');
                container.className = 'mermaid-diagram-container';
                container.id = 'container-' + id;

                // Replace original element
                if (isFenced) {
                    const preElement = element.parentElement;
                    if (preElement && preElement.tagName === 'PRE') {
                        preElement.replaceWith(container);
                    } else {
                        element.replaceWith(container);
                    }
                } else {
                    element.parentNode.insertBefore(container, element);
                    element.remove();
                }

                try {
                    // Pre-render sanitization for common AI hallucinations
                    let sanitizedContent = content
                        .replace(/\[\[/g, '[') // Fix nested/double brackets
                        .replace(/\]\]/g, ']')
                        .replace(/([^\\])\$/g, '$1\\$'); // Escape unescaped dollar signs

                    // Render
                    const { svg } = await mermaid.render(id, sanitizedContent);
                    container.innerHTML = svg;
                    console.log(`Successfully rendered diagram ${id}`);

                    // Init Zoom/Pan with original content
                    initZoomPan(container, id, content);
                } catch (error) {
                    console.error('Mermaid rendering failed:', error);
                    container.innerHTML = `<div style="padding: 1rem; color: red;">
                        Failed to render diagram
                        <pre style="background: #f5f5f5; padding: 0.5rem; margin-top: 0.5rem; overflow: auto; font-size: 0.8rem;">${content}</pre>
                    </div>`;
                    container.style.height = 'auto';
                }
            };

            // 1. Process fenced code blocks
            const codeElements = document.querySelectorAll('pre code.language-mermaid:not([data-processed])');
            for (const element of codeElements) {
                element.setAttribute('data-processed', 'true');
                await processElement(element, element.textContent.trim(), true);
            }

            // 2. Process plain text
            const markdownContent = document.querySelector('.markdown-content');
            if (markdownContent) {
                const walker = document.createTreeWalker(markdownContent, NodeFilter.SHOW_TEXT, null, false);
                const textNodes = [];
                let node;
                while (node = walker.nextNode()) {
                    const text = node.textContent.trim();
                    if (text.match(/^(graph|sequenceDiagram|classDiagram|stateDiagram|erDiagram|journey|gantt|pie|gitGraph|flowchart)\s/)) {
                        textNodes.push(node);
                    }
                }
                for (const textNode of textNodes) {
                    await processElement(textNode, textNode.textContent.trim(), false);
                }
            }
        };

        // --- Sidebar Resizing Logic ---
        let isResizing = false;
        let currentResizer = null;

        window.startResize = (side) => {
            isResizing = true;
            currentResizer = side;
            document.body.style.cursor = 'col-resize';
            document.body.classList.add('resizing'); // Optional: add class to body during resize
        };

        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            e.preventDefault(); // Prevent text selection

            const root = document.documentElement;

            if (currentResizer === 'left') {
                // Min width 150px, Max width 50% of screen
                const newWidth = Math.max(150, Math.min(e.clientX, window.innerWidth * 0.5));
                root.style.setProperty('--sidebar-width-left', `${newWidth}px`);
            } else if (currentResizer === 'right') {
                // Calculate width from right edge
                const newWidth = Math.max(200, Math.min(window.innerWidth - e.clientX, window.innerWidth * 0.5));
                root.style.setProperty('--sidebar-width-right', `${newWidth}px`);
            }
        });

        window.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                currentResizer = null;
                document.body.style.cursor = '';
                document.body.classList.remove('resizing');
                // Trigger resize event for charts/etc if needed
                window.dispatchEvent(new Event('resize'));
            }
        });
    </script>
</body>

</html>
